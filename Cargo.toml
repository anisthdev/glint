[package]
name = "glint"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Small Wayland layer-shell overlay that plays event animations, like Android's charging ripple"
license = "MIT AND Apache-2.0"
repository = "https://github.com/anisthdev/glint"
homepage = "https://github.com/anisthdev/glint"
readme = "README.md"
keywords = ["wayland", "hyprland", "animation", "overlay", "layer-shell"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
