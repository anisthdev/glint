[package]
name = "glint"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
rand = { version = "0.8", features = ["small_rng"] }
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
